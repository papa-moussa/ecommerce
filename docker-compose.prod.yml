# Production stack — with Caddy reverse proxy for TLS termination (SEC-004).
# SEC-021: No hardcoded IPs. All values come from environment variables / Doppler.
# Usage: doppler run -- docker-compose -f docker-compose.prod.yml up -d

services:
  # ---------------------------------------------------------------------------
  # SEC-004: Caddy — automatic TLS (Let's Encrypt) + HTTP→HTTPS redirect
  # ---------------------------------------------------------------------------
  caddy:
    # SEC-020: pinned to immutable digest (caddy 2.8-alpine, 2026-05-15)
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - frontend

  postgres:
    # SEC-020: pinned to immutable digest (postgres 16-alpine, 2026-05-15)
    image: postgres:16-alpine@sha256:890480b08124ce7f79960a9bb16fe39729aa302bd384bfd7c408fee6c8f7adb7
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SEC-021: No external port exposure — only accessible within Docker network
    expose:
      - '5432'
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # SEC-020: pinned to immutable digest (redis 7.4-alpine, 2026-05-15)
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    # SEC-021: No external port exposure — Redis stays on backend network only
    expose:
      - '6379'
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      # SEC-004: CORS_ORIGIN now uses the real HTTPS domain (set in Doppler)
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # SEC-022: RS256 key pair — private key signs tokens, public key verifies
      # Store both as PEM strings with \n replaced by literal \n in Doppler
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # JWT_ACCESS_SECRET kept for backward compat (deprecated — will be removed)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # SEC-002: JWT_TEMP_SECRET is mandatory and distinct from JWT_ACCESS_SECRET
      JWT_TEMP_SECRET: ${JWT_TEMP_SECRET}
      # SEC-013: AES-256-GCM key for encrypting TOTP secrets at rest (64 hex chars)
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SEC-004: COOKIE_SECURE must be true in production behind HTTPS
      COOKIE_SECURE: 'true'
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # App
      APP_URL: ${APP_URL}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Algolia
      ALGOLIA_APP_ID: ${ALGOLIA_APP_ID:-}
      ALGOLIA_API_KEY: ${ALGOLIA_API_KEY:-}
      ALGOLIA_SEARCH_KEY: ${ALGOLIA_SEARCH_KEY:-}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      # Chatbase
      CHATBASE_SYNC_SECRET: ${CHATBASE_SYNC_SECRET:-}
      # SEC-003: Admin seed credentials from environment (never hardcoded)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
    # SEC-004: API only exposes within Docker network — Caddy proxies inbound traffic
    expose:
      - '3001'
    networks:
      - backend
      - frontend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # SEC-004: All URLs now use HTTPS — set NEXT_PUBLIC_API_URL and NEXT_PUBLIC_SITE_URL in Doppler
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_ALGOLIA_APP_ID: ${NEXT_PUBLIC_ALGOLIA_APP_ID:-}
        NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${NEXT_PUBLIC_ALGOLIA_SEARCH_KEY:-}
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # SEC-004: Required by Next.js Edge middleware for JWT verification
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    # SEC-004: Web only exposes within Docker network — Caddy proxies inbound traffic
    expose:
      - '3000'
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # backend: DB + Redis — not reachable from internet
  backend:
    driver: bridge
  # frontend: API + Web + Caddy — Caddy is the only internet-facing service
  frontend:
    driver: bridge
